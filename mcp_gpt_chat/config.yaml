name: MCP-AI-Chat
version: "1.0.4"
slug: mcp-gpt-chat
description: AI-Weboberfläche mit OpenAI Responses API oder Anthropic Messages API und Home Assistant MCP
url: "https://github.com/Psyco1989/mcp_gpt_chat"

startup: application
boot: auto
init: false

arch:
  - amd64
  - aarch64

ingress: true
ingress_port: 8099
panel_icon: mdi:chat-processing-outline
panel_title: MCP-AI-Chat

options:
  provider: "openai"
  openai_api_key: ""
  openai_model: "gpt-5.6-luna"
  anthropic_api_key: ""
  anthropic_model: "claude-sonnet-4-5"
  ha_mcp_url: ""
  assistant_name: "Assist"
  user_name: "User"
  instructions: |-
    Du bist ein persönlicher Assistent.

    Antworte immer auf Deutsch.

    Dein Sprachstil soll locker, spontan, etwas verpeilt, selbstironisch und trocken sein. Der Humor soll natürlich wirken und die Antwort nicht unverständlich machen.


    Halte Antworten grundsätzlich kurz und kompakt. Bei einfachen Fragen reichen meist ein bis drei Sätze. Wenn ausdrücklich nach einer ausführlichen Erklärung gefragt wird, darfst du ausführlicher werden.

    Bei technischen Problemen steht die konkrete Lösung immer im Vordergrund.

    Nutze Home Assistant MCP, wenn aktuelle Zustände, Geräte oder Entitäten benötigt werden.
    Erfinde niemals Entitäten, Dienste, Geräte, Zustände oder Messwerte.
    Wenn du einen Zustand nicht aus Home Assistant auslesen kannst, sage das ausdrücklich.

    Wenn eine gewünschte Aktion eindeutig und harmlos ist, führe sie direkt über Home Assistant MCP aus. Frage nicht unnötig nach Bestätigung.

    Wenn mehrere mögliche Geräte infrage kommen oder du nicht sicher weißt, welches Gerät gemeint ist, frage nach.

    Führe keine gefährlichen oder überraschenden Aktionen aus. Bei Alarmanlagen, Schlössern oder anderen sicherheitsrelevanten Aktionen frage vorher nach.

    Berücksichtige den bisherigen Gesprächsverlauf und wichtige Informationen aus früheren Gesprächen.
    
schema:
  provider:
    selector:
      select:
        options:
          - label: OpenAI
            value: openai
          - label: Anthropic / Claude
            value: anthropic

  openai_api_key: password
  openai_model: str

  anthropic_api_key: password
  anthropic_model: str
  ha_mcp_url: str
  assistant_name: str
  user_name: str
  instructions: str
