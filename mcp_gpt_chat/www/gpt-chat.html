<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="referrer" content="no-referrer">
  <title id="page-title">MCP-AI-Chat</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#101114;
      --panel:#1a1c21;
      --panel-2:#20232b;
      --border:#30343e;
      --text:#f2f3f5;
      --muted:#a8adb8;
      --accent:#8b5cf6;
      --accent-hover:#7c3aed;
      --user:#30304a;
      --assistant:#22252c;
      --error:#7f1d1d;
      --recording:#dc2626;
    }

    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--bg); }
    body {
      min-height:100vh;
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }
    button,input,textarea { font:inherit; }

    #header {
      position:sticky;
      top:0;
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      width:100%;
      min-height:66px;
      padding:14px 20px;
      background:rgba(26,28,33,.96);
      border-bottom:1px solid var(--border);
      backdrop-filter:blur(10px);
    }

    #brand { min-width:0; display:flex; align-items:center; gap:12px; }
    #title { margin:0; color:var(--text); font-size:18px; font-weight:700; line-height:1.2; }
    #subtitle { margin-top:4px; color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .badge {
      display:inline-flex;
      align-items:center;
      min-height:28px;
      padding:0 9px;
      border:1px solid var(--border);
      border-radius:999px;
      background:var(--panel-2);
      color:var(--muted);
      font-size:11px;
      white-space:nowrap;
    }
    #status { color:#86efac; }
    #reset {
      width:34px;
      height:34px;
      padding:0;
      border:1px solid var(--border);
      border-radius:10px;
      background:var(--panel-2);
      color:var(--text);
      cursor:pointer;
      font-size:17px;
    }
    #reset:hover:not(:disabled) { background:#2a2e38; }

    #chat-wrap {
      width:100%;
      max-width:1000px;
      min-height:calc(100vh - 150px);
      margin:0 auto;
      padding:20px;
    }

    #welcome {
      width:100%;
      margin:0 0 20px;
      padding:20px;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:16px;
    }
    #welcome-name { margin:0 0 8px; font-size:22px; line-height:1.3; }
    #welcome-text { margin:0; color:var(--muted); font-size:14px; line-height:1.5; }

    #messages { display:flex; flex-direction:column; gap:14px; }
    .message {
      width:fit-content;
      max-width:85%;
      padding:13px 16px;
      border:1px solid var(--border);
      border-radius:16px;
      color:var(--text);
      line-height:1.5;
      overflow-wrap:anywhere;
      white-space:pre-wrap;
    }
    .user-message { align-self:flex-end; background:var(--user); border-bottom-right-radius:5px; }
    .assistant-message { align-self:flex-start; background:var(--assistant); border-bottom-left-radius:5px; }
    .error-message { background:var(--error); }
    .message-label { display:block; margin-bottom:6px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.5px; }
    .message-text { font-size:16px; }
    .typing { color:var(--muted); font-style:italic; }

    #footer {
      position:sticky;
      bottom:0;
      z-index:20;
      width:100%;
      padding:12px 14px 14px;
      background:rgba(26,28,33,.96);
      border-top:1px solid var(--border);
      backdrop-filter:blur(10px);
    }
    #form {
      display:flex;
      align-items:stretch;
      gap:8px;
      width:100%;
      max-width:1000px;
      margin:0 auto;
    }
    #input {
      flex:1 1 auto;
      width:100%;
      min-width:0;
      min-height:48px;
      max-height:180px;
      padding:13px 15px;
      resize:none;
      outline:none;
      background:var(--bg);
      color:var(--text);
      border:1px solid var(--border);
      border-radius:14px;
      font-size:16px;
      line-height:1.4;
      overflow-y:auto;
    }
    #input:focus { border-color:var(--accent); }
    #input::placeholder { color:var(--muted); }
    #mic,#send {
      display:flex;
      align-items:center;
      justify-content:center;
      width:48px;
      height:48px;
      flex:0 0 48px;
      padding:0;
      border:0;
      border-radius:14px;
      color:#fff;
      cursor:pointer;
      font-size:21px;
      font-weight:700;
      transition:background .2s ease,opacity .2s ease;
    }
    #mic { background:#3f4450; }
    #mic:hover:not(:disabled) { background:#525866; }
    #mic.recording { background:var(--recording); animation:pulse 1.2s infinite; }
    #send { background:var(--accent); }
    #send:hover:not(:disabled) { background:var(--accent-hover); }
    #mic:disabled,#send:disabled,#reset:disabled { opacity:.5; cursor:not-allowed; }
    #hint { width:100%; max-width:1000px; min-height:18px; margin:7px auto 0; padding:0 2px; color:var(--muted); font-size:11px; text-align:center; }

    @keyframes pulse { 0%{opacity:1} 50%{opacity:.55} 100%{opacity:1} }

    @media (max-width:600px) {
      #header { padding:12px 14px; }
      #chat-wrap { padding:14px; }
      #welcome { padding:16px; border-radius:14px; }
      #welcome-name { font-size:20px; }
      .message { max-width:92%; padding:13px 14px; }
      #footer { padding:10px; }
      #input { min-height:52px; font-size:16px; }
      #mic,#send { width:52px; height:52px; flex-basis:52px; }
      .badge { display:none; }
    }
  </style>
</head>
<body>
  <header id="header">
    <div id="brand">
      <div>
        <h1 id="title">MCP-AI-Chat</h1>
        <div id="subtitle">Dein persönlicher Home-Assistant-Assistent</div>
      </div>
    </div>
    <div id="meta">
      <span class="badge" id="provider">OpenAI</span>
      <span class="badge" id="model">gpt-6-luna</span>
      <span class="badge" id="mcp-badge">MCP aus</span>
      <span class="badge" id="status">● Online</span>
      <button id="reset" type="button" title="Gespräch zurücksetzen" aria-label="Gespräch zurücksetzen">↺</button>
    </div>
  </header>

  <main id="chat-wrap">
    <section id="welcome">
      <h2 id="welcome-name">Hi 👋</h2>
      <p id="welcome-text">Der Chat wird geladen...</p>
    </section>
    <section id="messages" aria-live="polite"></section>
  </main>

  <footer id="footer">
    <form id="form">
      <textarea id="input" maxlength="20000" placeholder="Schreib mir etwas..." autocomplete="off" spellcheck="true" rows="1"></textarea>
      <button id="mic" type="button" aria-label="Spracheingabe starten" title="Spracheingabe starten">🎙️</button>
      <button id="send" type="submit" aria-label="Nachricht senden" title="Nachricht senden">➤</button>
    </form>
    <div id="hint">Enter zum Senden · Shift + Enter für eine neue Zeile</div>
  </footer>

  <script>
    (() => {
      "use strict";

      const messagesEl = document.getElementById("messages");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const send = document.getElementById("send");
      const mic = document.getElementById("mic");
      const status = document.getElementById("status");
      const hint = document.getElementById("hint");
      const resetButton = document.getElementById("reset");
      const pageTitle = document.getElementById("page-title");
      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");
      const provider = document.getElementById("provider");
      const model = document.getElementById("model");
      const mcpBadge = document.getElementById("mcp-badge");
      const welcomeName = document.getElementById("welcome-name");
      const welcomeText = document.getElementById("welcome-text");

      let assistantName = "Assist";
      let userName = "User";
      let currentProvider = "openai";
      let greetingMode = "local";
      let messages = [];

      let recognition = null;
      let isListening = false;
      let speechBaseText = "";
      let speechFinalText = "";
      let speechInterimText = "";
      let speechSending = false;
      let requestWasSpoken = false;
      let speechSilenceTimer = null;
      let speechLastDisplayedText = "";
      let speechLastChangeAt = 0;
      let typingDotsTimer = null;

      function setStatus(text, color = "#86efac") {
        status.textContent = text;
        status.style.color = color;
      }

      function scrollToBottom() {
        const run = () => {
          window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
          document.documentElement.scrollTop = document.documentElement.scrollHeight;
          document.body.scrollTop = document.body.scrollHeight;
        };
        run();
        setTimeout(run, 150);
        setTimeout(run, 400);
      }

      function addMessage(role, text, isError = false) {
        const message = document.createElement("div");
        message.className = "message " + (role === "user" ? "user-message" : "assistant-message");
        if (isError) message.classList.add("error-message");

        const label = document.createElement("span");
        label.className = "message-label";
        label.textContent = role === "user" ? userName : assistantName;

        const messageText = document.createElement("div");
        messageText.className = "message-text";
        messageText.textContent = String(text || "");

        message.append(label, messageText);
        messagesEl.appendChild(message);
        scrollToBottom();
      }

      function renderHistory(history) {
        messagesEl.textContent = "";
        messages = Array.isArray(history) ? history : [];
        for (const message of messages) {
          addMessage(message.role, message.content);
        }
      }

      function addTypingMessage() {
        removeTypingMessage();
        const message = document.createElement("div");
        message.id = "typing";
        message.className = "message assistant-message typing";
        message.textContent = assistantName + " denkt nach";
        messagesEl.appendChild(message);

        let dots = 0;
        typingDotsTimer = setInterval(() => {
          dots = (dots + 1) % 4;
          message.textContent = assistantName + " denkt nach" + ".".repeat(dots);
        }, 350);
        scrollToBottom();
      }

      function removeTypingMessage() {
        if (typingDotsTimer !== null) {
          clearInterval(typingDotsTimer);
          typingDotsTimer = null;
        }
        document.getElementById("typing")?.remove();
      }

      async function readJsonResponse(response) {
        const contentType = response.headers.get("content-type") || "";
        if (!contentType.includes("application/json")) {
          const text = await response.text();
          throw new Error("Server hat keine JSON-Antwort geliefert: " + text.slice(0, 300));
        }
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "HTTP-Fehler " + response.status);
        }
        return data;
      }

      async function loadConfig() {
        const response = await fetch("./api/config", { headers: { "Accept": "application/json" } });
        const data = await readJsonResponse(response);

        assistantName = data.assistant_name || "Assist";
        userName = data.user_name || "User";
        currentProvider = data.provider || "openai";
        greetingMode = data.greeting_mode || "local";

        pageTitle.textContent = assistantName;
        title.textContent = assistantName;
        subtitle.textContent = "Dein persönlicher Home-Assistant-Assistent";
        welcomeName.textContent = "Hi " + userName + " 👋";
        input.placeholder = "Schreib " + assistantName + " etwas...";

        provider.textContent = data.provider_label || currentProvider;
        model.textContent = data.model || "";
        mcpBadge.textContent = data.mcp_enabled ? "MCP aktiv" : "MCP aus";
        mcpBadge.style.color = data.mcp_enabled ? "#86efac" : "var(--muted)";

        if (data.web_search_enabled) {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.id = "web-badge";
          badge.textContent = "Websuche";
          badge.style.color = "#93c5fd";
          document.getElementById("meta").insertBefore(badge, resetButton);
        }
      }

      async function loadHistory() {
        try {
          const response = await fetch("./api/history", { headers: { "Accept": "application/json" } });
          const data = await readJsonResponse(response);
          renderHistory(data.messages);
        } catch (error) {
          console.error("Verlauf:", error);
        }
      }

      async function loadGreeting() {
        try {
          const response = await fetch("./api/greeting", { headers: { "Accept": "application/json" } });
          const data = await readJsonResponse(response);
          welcomeText.textContent = data.text || "Was darf ich für dich erledigen?";
        } catch (error) {
          console.error("Begrüßung:", error);
          welcomeText.textContent = "Was darf ich für dich erledigen?";
        }
      }

      function clearSpeechSilenceTimer() {
        if (speechSilenceTimer !== null) {
          clearInterval(speechSilenceTimer);
          speechSilenceTimer = null;
        }
      }

      function normalizeSpeechText(text) {
        return String(text || "").replace(/\s+/g, " ").trim();
      }

      function mergeFinalSpeechText(current, incoming) {
        current = normalizeSpeechText(current);
        incoming = normalizeSpeechText(incoming);
        if (!incoming) return current;
        if (!current) return incoming;

        const a = current.toLowerCase();
        const b = incoming.toLowerCase();
        if (a === b || b.startsWith(a + " ")) return incoming;
        if (a.startsWith(b + " ") || a.includes(b)) return current;

        const aw = current.split(" ");
        const bw = incoming.split(" ");
        const max = Math.min(aw.length, bw.length);
        for (let n = max; n > 0; n--) {
          if (aw.slice(-n).join(" ").toLowerCase() === bw.slice(0, n).join(" ").toLowerCase()) {
            return normalizeSpeechText(current + " " + bw.slice(n).join(" "));
          }
        }
        return normalizeSpeechText(current + " " + incoming);
      }

      function getSpeechText() {
        return normalizeSpeechText(speechBaseText + " " + speechFinalText + " " + speechInterimText);
      }

      function resetSpeechUi() {
        mic.classList.remove("recording");
        mic.textContent = "🎙️";
        mic.title = "Spracheingabe starten";
        mic.setAttribute("aria-label", "Spracheingabe starten");
      }

      function stopSpeechOutput() {
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      }

      function startSpeechSilenceTimer() {
        clearSpeechSilenceTimer();
        speechSilenceTimer = setInterval(() => {
          if (!isListening || speechSending) return;
          if (getSpeechText() && speechLastChangeAt && Date.now() - speechLastChangeAt >= 2000) {
            sendSpeechMessage();
          }
        }, 100);
      }

      function sendSpeechMessage() {
        if (speechSending) return;
        const text = getSpeechText();
        if (!text) return;

        speechSending = true;
        clearSpeechSilenceTimer();
        isListening = false;
        input.value = text;
        input.dispatchEvent(new Event("input", { bubbles:true }));

        if (recognition) {
          try { recognition.abort(); } catch (_) {}
        }
        resetSpeechUi();
        setTimeout(() => {
          if (speechSending && input.value.trim()) form.requestSubmit();
        }, 100);
      }

      function speakAnswer(text) {
        if (!requestWasSpoken || !text || !("speechSynthesis" in window)) return;
        stopSpeechOutput();
        const spokenText = String(text)
          .replace(/```[\s\S]*?```/g, " ")
          .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
          .replace(/[*_#>`]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
        if (!spokenText) return;

        const utterance = new SpeechSynthesisUtterance(spokenText);
        utterance.lang = "de-DE";
        utterance.rate = 1.25;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;
        window.speechSynthesis.speak(utterance);
      }

      function setupSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          mic.disabled = true;
          mic.title = "Spracheingabe wird von diesem Browser nicht unterstützt";
          return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = "de-DE";
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
          isListening = true;
          speechSending = false;
          speechFinalText = "";
          speechInterimText = "";
          speechBaseText = normalizeSpeechText(input.value);
          speechLastDisplayedText = speechBaseText;
          speechLastChangeAt = Date.now();
          startSpeechSilenceTimer();
          mic.classList.add("recording");
          mic.textContent = "🛑";
          mic.title = "Spracheingabe stoppen";
          mic.setAttribute("aria-label", "Spracheingabe stoppen");
          setStatus("● Hört zu...", "#f87171");
          hint.textContent = "Sprich jetzt...";
        };

        recognition.onresult = event => {
          if (speechSending) return;
          let finalText = speechFinalText;
          let interimText = "";

          for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            if (!result || !result[0]) continue;
            const transcript = normalizeSpeechText(result[0].transcript);
            if (!transcript) continue;
            if (result.isFinal) {
              finalText = mergeFinalSpeechText(finalText, transcript);
            } else {
              interimText = transcript;
            }
          }

          speechFinalText = normalizeSpeechText(finalText);
          speechInterimText = normalizeSpeechText(interimText);
          const newText = getSpeechText();
          if (newText !== speechLastDisplayedText) {
            speechLastDisplayedText = newText;
            speechLastChangeAt = Date.now();
          }
          input.value = newText;
          input.dispatchEvent(new Event("input", { bubbles:true }));
        };

        recognition.onerror = event => {
          console.error("Speech Recognition Fehler:", event.error);
          if (event.error === "no-speech" || event.error === "aborted") return;
          isListening = false;
          clearSpeechSilenceTimer();
          resetSpeechUi();
          setStatus("● Spracheingabe fehlgeschlagen", "#fca5a5");
          hint.textContent = "Spracheingabe konnte nicht gestartet werden.";
        };

        recognition.onend = () => {
          if (speechSending || !isListening) return;
          setTimeout(() => {
            if (!isListening || speechSending) return;
            try { recognition.start(); } catch (_) {}
          }, 100);
        };
      }

      function startSpeechRecognition() {
        if (!recognition || isListening || send.disabled) return;
        stopSpeechOutput();
        requestWasSpoken = true;
        speechSending = false;
        speechFinalText = "";
        speechInterimText = "";
        speechBaseText = normalizeSpeechText(input.value);
        speechLastDisplayedText = speechBaseText;
        speechLastChangeAt = Date.now();
        clearSpeechSilenceTimer();
        try { recognition.start(); } catch (_) {}
      }

      function stopSpeechRecognition() {
        if (!recognition || !isListening) return;
        clearSpeechSilenceTimer();
        isListening = false;
        try { recognition.stop(); } catch (_) {}
        resetSpeechUi();
        setStatus("● Online");
        hint.textContent = "Tippe eine Nachricht oder sprich.";
      }

      function resizeInput() {
        input.style.height = "48px";
        input.style.height = Math.min(input.scrollHeight, 180) + "px";
      }

      mic.addEventListener("click", () => {
        if (isListening) stopSpeechRecognition();
        else startSpeechRecognition();
      });

      resetButton.addEventListener("click", async () => {
        if (!confirm("Gespräch wirklich zurücksetzen?")) return;
        resetButton.disabled = true;
        send.disabled = true;
        mic.disabled = true;
        stopSpeechRecognition();
        stopSpeechOutput();
        try {
          const response = await fetch("./api/reset", {
            method:"POST",
            headers:{"Accept":"application/json"}
          });
          await readJsonResponse(response);
          messages = [];
          messagesEl.textContent = "";
          input.value = "";
          resizeInput();
          await loadGreeting();
          setStatus("● Online");
          hint.textContent = "Neues Gespräch gestartet.";
        } catch (error) {
          console.error("Reset:", error);
          hint.textContent = "Gespräch konnte nicht zurückgesetzt werden.";
          setStatus("● Reset fehlgeschlagen", "#fca5a5");
        } finally {
          resetButton.disabled = false;
          send.disabled = false;
          mic.disabled = !recognition;
          input.focus();
        }
      });

      form.addEventListener("submit", async event => {
        event.preventDefault();

        if (isListening) {
          clearSpeechSilenceTimer();
          isListening = false;
          try { recognition.abort(); } catch (_) {}
          resetSpeechUi();
        }

        const text = input.value.trim();
        if (!text || send.disabled) return;

        clearSpeechSilenceTimer();
        input.value = "";
        resizeInput();
        send.disabled = true;
        mic.disabled = true;
        resetButton.disabled = true;
        setStatus("● Denkt nach...", "#facc15");
        hint.textContent = assistantName + " arbeitet...";

        messages.push({ role:"user", content:text });
        addMessage("user", text);
        addTypingMessage();

        try {
          const response = await fetch("./api/chat", {
            method:"POST",
            headers:{
              "Content-Type":"application/json",
              "Accept":"application/json"
            },
            body:JSON.stringify({ message:text })
          });
          const data = await readJsonResponse(response);
          removeTypingMessage();

          const answer = data.text || "Keine Antwort erhalten.";
          messages.push({ role:"assistant", content:answer });
          addMessage("assistant", answer);
          speakAnswer(answer);
          setStatus("● Online");
          hint.textContent = "Tippe eine Nachricht oder sprich.";
        } catch (error) {
          removeTypingMessage();
          addMessage("assistant", "Fehler: " + error.message, true);
          setStatus("● Anfrage fehlgeschlagen", "#fca5a5");
          hint.textContent = "Die Anfrage ist fehlgeschlagen.";
          console.error(assistantName + " Fehler:", error);
        } finally {
          send.disabled = false;
          mic.disabled = !recognition;
          resetButton.disabled = false;
          speechSending = false;
          speechFinalText = "";
          speechInterimText = "";
          speechBaseText = "";
          speechLastDisplayedText = "";
          speechLastChangeAt = 0;
          clearSpeechSilenceTimer();

          if (!requestWasSpoken) {
            input.focus();
          } else {
            scrollToBottom();
          }
          requestWasSpoken = false;
        }
      });

      input.addEventListener("input", resizeInput);
      input.addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          if (!send.disabled) form.requestSubmit();
        }
      });

      window.addEventListener("beforeunload", () => {
        stopSpeechOutput();
        clearSpeechSilenceTimer();
        removeTypingMessage();
      });

      async function initializeApp() {
        try {
          await loadConfig();
          await Promise.all([loadHistory(), loadGreeting()]);
        } catch (error) {
          console.error("Initialisierung:", error);
          welcomeText.textContent = "Die Verbindung zum Chat konnte nicht aufgebaut werden.";
          setStatus("● Verbindungsfehler", "#fca5a5");
        }
        setupSpeechRecognition();
        resizeInput();
        input.focus();
      }

      initializeApp();
    })();
  </script>
</body>
</html>
